paths:
  raw: data/mpd/raw              # real Spotify MPD slices (scripts/extract_mpd.py)
  interim: data/mpd/interim    # flattened parquet
  processed: data/mpd/processed
  reports: reports/mpd

synthetic:
  n_playlists: 1000000
  n_tracks: 400000
  n_moods: 24
  seed: 42

prep:
  min_track_count: 3       # drop tracks appearing in fewer playlists
  min_playlist_len: 10
  test_frac: 0.01         # 10k test playlists at full scale
  n_seed: 5                # tracks given to the model; the rest are targets
  seed: 42

eval:
  k: 50

cooccur:
  batch_size: 64

graph:
  top_n_tracks: 20000       # build the track graph over the most popular tracks
  min_edge_weight: 25       # 20x the playlists of mpd50 (which uses 3); w>=3 gives 53M edges, too many for 4 GB

bench:                     # full-scale CPU vs GPU (python -m mixtape bench --config configs/mpd.yaml)
  repeats_cpu: 1           # one CPU pass takes long enough; GPU keeps best-of-2 (first pass warms up CUDA)
  repeats_gpu: 2
  n_recommend: 2000        # time co-occurrence recommendation on 2k test playlists
  graph_top_n: 5000        # networkx can't hold the 11.5M-edge top-20k graph in WSL's 7.6 GB
  graph_min_edge_weight: 25

sasrec:
  max_len: 50
  dim: 64
  heads: 2
  layers: 2
  dropout: 0.2
  epochs: 150              # upper bound; early stopping usually ends sooner
  target_window: 5         # predict a random track among the next 5 (1 = classic next-item)
  val_size: 500            # training playlists held out for early stopping (0 = off)
  eval_every: 5
  patience: 3              # stop after 3 evaluations without improvement
  batch_size: 256
  lr: 0.001
  n_neg: 128

hybrid:
  weights: [1.0, 0.5]      # [cooccur, sasrec], tuned on MPD validation (scripts/tune_hybrid.py)
  title_weight: 0.5        # tuned on MPD validation playlists

title:
  # TF-IDF (exact wording) + MPNet (meaning); see reports/title_encoders.json
  model: hybrid:sentence-transformers/all-mpnet-base-v2
  top_m: 50                # similar training playlists to pool tracks from
